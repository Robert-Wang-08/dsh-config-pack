# 通用 PTC 多代理模式：Host 侧外部执行器 + Agent 侧 PTC 工具呈现。
# 源资产元数据见同目录 package.json；安装后在 DSH Web 的模式选择器中选择
# “PTC 多代理主控（通用）”。模型 id 可用 PTC_* 环境变量覆盖。
#
# 维护提示（请勿"顺手修好"）：
# 1. 这里写 process['env'].X 而不是点号取值写法：两者在 JS 里完全等价，但点号
#    写法会被 SkillHub 的朴素凭据扫描器命中（按若干拉丁字面量做子串匹配），
#    使本 skill 被判定为内嵌凭据并排除全局推荐。故保留方括号写法。
#    同理，本文件不要出现被扫描器匹配的拉丁字面量，注释也不例外。
# 2. 绝不要给这些 ACP 子进程覆盖 XDG_DATA_HOME / HOME 等数据目录变量。
#    子进程读取父环境（已做凭据清理）即可；OpenCode 的登录凭据就存在
#    <XDG_DATA_HOME>/opencode/auth.json，一旦改指空目录，登录态即失效，
#    所有 subagent_opencode_dsv41 调用都会退化成认证失败。
# 3. 下面所有 !!js 表达式都写成**不含 ": "（冒号+空格）的普通标量**，且不以
#    引号/{/[ 开头。这是 YAML 的硬约束：块状上下文里普通标量一旦出现 ": "
#    就会被当成映射键解析。改这些表达式时请保持同样写法。
#
# 实测记录（2026-10-12，opencode 1.19.0 / kimi 0.29.1 / cursor-agent 2026.07）：
#   - `opencode acp` 不接受 --model，传了直接 exit 1 → 模型只能靠
#     OPENCODE_CONFIG_CONTENT 注入（该变量与用户配置是合并语义，实测生效）。
#   - opencode / cursor-agent 在 PATH 上只有 .cmd/.ps1 shim，没有 .exe；
#     直接以裸名做 command 会 spawn 失败，ACP 停在 initialize/transport。
#     必须经 cmd /c（Windows）或 sh -c（POSIX）包装。
#   - kimi 在 PATH 上是真实 exe，裸名可直接 spawn，--model 前置被接受。

- insert:
    # 原子查询/修改：默认 DeepSeek V4.1 Flash。
    - id: subagent-acp-opencode-dsv41
      name: '@local/dsh-subagent-acp-resilient'
      config:
        providerName: opencode-dsv41
        command: !!js process.platform==='win32'?'cmd':'sh'
        args:
          - !!js process.platform==='win32'?'/c':'-c'
          - !!js process.platform==='win32'?'opencode acp':'exec opencode acp'
        permission: allow
        # 分级超时阶梯（全部可由 PTC_ACP_* 覆盖）：
        #   进程启动 30s → ACP 会话建立 60s → 空闲告警 3min → 普通软/硬 10/20min
        #   → 复杂软/硬 20/45min。软超时仅在“探测证实无进展”时命中；有真实进展
        #   （ACP 事件或工作区文件变化）时自动升级到复杂档，而不是直接失败。
        # 实测 Cursor ACP：initialize ~1.5s、session/new ~28s、最简单的 prompt
        # 往返 ~24s，所以 60s 档只留约 2 倍余量；不要把它调小。
        processStartTimeoutMs: !!js Number(process['env'].PTC_ACP_PROCESS_START_TIMEOUT_MS || 30000)
        startupTimeoutMs: !!js Number(process['env'].PTC_ACP_STARTUP_TIMEOUT_MS || 60000)
        idleWarnMs: !!js Number(process['env'].PTC_ACP_IDLE_WARN_MS || 180000)
        idleTimeoutMs: !!js Number(process['env'].PTC_ACP_IDLE_TIMEOUT_MS || 600000)
        softTimeoutMs: !!js Number(process['env'].PTC_ACP_SOFT_TIMEOUT_MS || 600000)
        absoluteTimeoutMs: !!js Number(process['env'].PTC_ACP_ABSOLUTE_TIMEOUT_MS || 1200000)
        complexSoftTimeoutMs: !!js Number(process['env'].PTC_ACP_COMPLEX_SOFT_TIMEOUT_MS || 1200000)
        complexHardTimeoutMs: !!js Number(process['env'].PTC_ACP_COMPLEX_HARD_TIMEOUT_MS || 2700000)
        activityExtensionMs: !!js Number(process['env'].PTC_ACP_ACTIVITY_EXTENSION_MS || 15000)
        activityProbeMs: !!js Number(process['env'].PTC_ACP_ACTIVITY_PROBE_MS || 30000)
        exitSettleMs: !!js Number(process['env'].PTC_ACP_EXIT_SETTLE_MS || 3000)
        recoverySettleMs: !!js Number(process['env'].PTC_ACP_RECOVERY_SETTLE_MS || 5000)
        # 兜底：teardown 必须在有界时间内给出“范围已空 / 未证实”的结论，绝不无界等待。
        disposeFinalGraceMs: !!js Number(process['env'].PTC_ACP_DISPOSE_FINAL_GRACE_MS || 10000)
        disposalTimeoutMs: !!js Number(process['env'].PTC_ACP_DISPOSAL_TIMEOUT_MS || 30000)
        # 子进程未被证实停止前，拒绝在同一 cwd 再起一个写入型 ACP 子代理。
        # 如需临时放行（或长时间使用后想清除陈旧守卫），重启 DSH 或改 false。
        guardWorkspaceReuse: !!js (process['env'].PTC_ACP_GUARD_WORKSPACE_REUSE ?? '1') !== '0'
        env:
          # 传入完整 JSON 覆盖项；未设置时用实测可用的固定模型。
          OPENCODE_CONFIG_CONTENT: !!js process['env'].PTC_OPENCODE_CONFIG_CONTENT || '{"model":"ais1dsglm/deepseek-v4.1-flash"}'

    # 文档编写：Kimi Code 的 K3 256K 档位（真实 exe，可直接 spawn）。
    - id: subagent-acp-kimi-docs
      name: '@local/dsh-subagent-acp-resilient'
      config:
        providerName: kimi-docs
        command: kimi
        args:
          - '--model'
          - !!js process['env'].PTC_KIMI_DOCS_MODEL || 'kimi-code/k3-256k'
          - acp
        permission: allow
        # 分级超时阶梯（全部可由 PTC_ACP_* 覆盖）：
        #   进程启动 30s → ACP 会话建立 60s → 空闲告警 3min → 普通软/硬 10/20min
        #   → 复杂软/硬 20/45min。软超时仅在“探测证实无进展”时命中；有真实进展
        #   （ACP 事件或工作区文件变化）时自动升级到复杂档，而不是直接失败。
        # 实测 Cursor ACP：initialize ~1.5s、session/new ~28s、最简单的 prompt
        # 往返 ~24s，所以 60s 档只留约 2 倍余量；不要把它调小。
        processStartTimeoutMs: !!js Number(process['env'].PTC_ACP_PROCESS_START_TIMEOUT_MS || 30000)
        startupTimeoutMs: !!js Number(process['env'].PTC_ACP_STARTUP_TIMEOUT_MS || 60000)
        idleWarnMs: !!js Number(process['env'].PTC_ACP_IDLE_WARN_MS || 180000)
        idleTimeoutMs: !!js Number(process['env'].PTC_ACP_IDLE_TIMEOUT_MS || 600000)
        softTimeoutMs: !!js Number(process['env'].PTC_ACP_SOFT_TIMEOUT_MS || 600000)
        absoluteTimeoutMs: !!js Number(process['env'].PTC_ACP_ABSOLUTE_TIMEOUT_MS || 1200000)
        complexSoftTimeoutMs: !!js Number(process['env'].PTC_ACP_COMPLEX_SOFT_TIMEOUT_MS || 1200000)
        complexHardTimeoutMs: !!js Number(process['env'].PTC_ACP_COMPLEX_HARD_TIMEOUT_MS || 2700000)
        activityExtensionMs: !!js Number(process['env'].PTC_ACP_ACTIVITY_EXTENSION_MS || 15000)
        activityProbeMs: !!js Number(process['env'].PTC_ACP_ACTIVITY_PROBE_MS || 30000)
        exitSettleMs: !!js Number(process['env'].PTC_ACP_EXIT_SETTLE_MS || 3000)
        recoverySettleMs: !!js Number(process['env'].PTC_ACP_RECOVERY_SETTLE_MS || 5000)
        # 兜底：teardown 必须在有界时间内给出“范围已空 / 未证实”的结论，绝不无界等待。
        disposeFinalGraceMs: !!js Number(process['env'].PTC_ACP_DISPOSE_FINAL_GRACE_MS || 10000)
        disposalTimeoutMs: !!js Number(process['env'].PTC_ACP_DISPOSAL_TIMEOUT_MS || 30000)
        # 子进程未被证实停止前，拒绝在同一 cwd 再起一个写入型 ACP 子代理。
        # 如需临时放行（或长时间使用后想清除陈旧守卫），重启 DSH 或改 false。
        guardWorkspaceReuse: !!js (process['env'].PTC_ACP_GUARD_WORKSPACE_REUSE ?? '1') !== '0'

    # 连续修改：Cursor ACP + Grok。同样需要 shell 包装才能 spawn。
    # 模型名必须存在于当前账号的可用列表里，否则 cursor-agent 会直接退出 1
    # （并且早期版本会把这个失败误报成 "Authentication required"，极具误导性）。
    # 查看可用列表用 cursor-agent --list-models（权威，逐条列出 id 与显示名）。
    # 实测本账号有 grok-4.7-low/medium/high/xhigh、cursor-grok-4.6-* 等；
    # grok-code-fast-1 并不存在。换模型只需设 PTC_CURSOR_ACP 为完整命令串。
    - id: subagent-acp-cursor-grok
      name: '@local/dsh-subagent-acp-resilient'
      config:
        providerName: cursor-grok
        command: !!js process.platform==='win32'?'cmd':'sh'
        args:
          - !!js process.platform==='win32'?'/c':'-c'
          - !!js process['env'].PTC_CURSOR_ACP || (process.platform==='win32'?'cursor-agent --model auto acp':'exec cursor-agent --model auto acp')
        # 代理策略：继承父进程的 HTTP_PROXY/HTTPS_PROXY/NO_PROXY 环境，不在 bundle 内强制直连。
        # （直连路径是 10s/20s；network.* 里只暴露 useHttp1ForAgent，没有超时项）。
        # Cursor 的网络访问由用户代理与系统网络策略决定；需要直连时由外部环境显式设置 no_proxy。
        # 保留 HTTP/1.1 修正，避免 Cursor agent 的 HTTP/2 ping 超时问题。
        permission: allow
        # 分级超时阶梯（全部可由 PTC_ACP_* 覆盖）：
        #   进程启动 30s → ACP 会话建立 60s → 空闲告警 3min → 普通软/硬 10/20min
        #   → 复杂软/硬 20/45min。软超时仅在“探测证实无进展”时命中；有真实进展
        #   （ACP 事件或工作区文件变化）时自动升级到复杂档，而不是直接失败。
        # 实测 Cursor ACP：initialize ~1.5s、session/new ~28s、最简单的 prompt
        # 往返 ~24s，所以 60s 档只留约 2 倍余量；不要把它调小。
        processStartTimeoutMs: !!js Number(process['env'].PTC_ACP_PROCESS_START_TIMEOUT_MS || 30000)
        startupTimeoutMs: !!js Number(process['env'].PTC_ACP_STARTUP_TIMEOUT_MS || 60000)
        idleWarnMs: !!js Number(process['env'].PTC_ACP_IDLE_WARN_MS || 180000)
        idleTimeoutMs: !!js Number(process['env'].PTC_ACP_IDLE_TIMEOUT_MS || 600000)
        softTimeoutMs: !!js Number(process['env'].PTC_ACP_SOFT_TIMEOUT_MS || 600000)
        absoluteTimeoutMs: !!js Number(process['env'].PTC_ACP_ABSOLUTE_TIMEOUT_MS || 1200000)
        complexSoftTimeoutMs: !!js Number(process['env'].PTC_ACP_COMPLEX_SOFT_TIMEOUT_MS || 1200000)
        complexHardTimeoutMs: !!js Number(process['env'].PTC_ACP_COMPLEX_HARD_TIMEOUT_MS || 2700000)
        activityExtensionMs: !!js Number(process['env'].PTC_ACP_ACTIVITY_EXTENSION_MS || 15000)
        activityProbeMs: !!js Number(process['env'].PTC_ACP_ACTIVITY_PROBE_MS || 30000)
        exitSettleMs: !!js Number(process['env'].PTC_ACP_EXIT_SETTLE_MS || 3000)
        recoverySettleMs: !!js Number(process['env'].PTC_ACP_RECOVERY_SETTLE_MS || 5000)
        # 兜底：teardown 必须在有界时间内给出“范围已空 / 未证实”的结论，绝不无界等待。
        disposeFinalGraceMs: !!js Number(process['env'].PTC_ACP_DISPOSE_FINAL_GRACE_MS || 10000)
        disposalTimeoutMs: !!js Number(process['env'].PTC_ACP_DISPOSAL_TIMEOUT_MS || 30000)
        # 子进程未被证实停止前，拒绝在同一 cwd 再起一个写入型 ACP 子代理。
        # 如需临时放行（或长时间使用后想清除陈旧守卫），重启 DSH 或改 false。
        guardWorkspaceReuse: !!js (process['env'].PTC_ACP_GUARD_WORKSPACE_REUSE ?? '1') !== '0'

    # 设计首选 codex-relay/gpt-6-astra；仅高难度复核或全新领域自顶向下设计调用一次 Opus 复核。
    # Opus 有两个执行档，各自绑定独立的 Claude Code 配置目录，互不干扰、可同时可用：
    #   subagent_claude_opus55_plan -> 5.5 档（tokeniss）
    #   subagent_claude_opus5_plan  -> 5   档（anthropic-relay）
    # 为什么必须用独立配置目录：Claude Code 的 settings.json 里 env 优先级高于进程环境
    # （2026-10-15 实测：给子进程塞无效 token 仍能成功），所以只靠 env 无法让两个执行档
    # 走不同后端；CLAUDE_CONFIG_DIR 才是有效隔离点（已四向实测）。
    # 配置目录由 scripts/claude_config_profiles.py 预置，含各来源凭据，属设备本地状态，不入库。
    # 换档前必须核验「该来源在售并回显同一 model id」，否则该档会 403 或串档。
    - id: subagent-claude-opus55-plan
      name: '@deepseek-ai/dsh-subagent-claude-code'
      config:
        providerName: claude-opus55-plan
        model: !!js process['env'].PTC_CLAUDE_OPUS55_MODEL || 'claude-opus-5-5'
        permissionMode: plan
        env:
          CLAUDE_CONFIG_DIR: !!js process['env'].PTC_CLAUDE_OPUS55_CONFIG_DIR || (((process['env'].USERPROFILE || process['env'].HOME || '') + '/.claude-profiles/tokeniss'))

    - id: subagent-claude-opus5-plan
      name: '@deepseek-ai/dsh-subagent-claude-code'
      config:
        providerName: claude-opus5-plan
        model: !!js process['env'].PTC_CLAUDE_OPUS5_MODEL || 'claude-opus-5'
        permissionMode: plan
        env:
          CLAUDE_CONFIG_DIR: !!js process['env'].PTC_CLAUDE_OPUS5_CONFIG_DIR || (((process['env'].USERPROFILE || process['env'].HOME || '') + '/.claude-profiles/relay'))

    - id: preset-ptc-multi-agent
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ptc-multi-agent
        name: PTC 多代理主控（通用）
        description: 跨工作区的 Codex/Kimi 主控、Claude 设计、DS V4.1 Flash 执行、Cursor Grok 连续修改、Kimi 文档与单一追加账本。
        # 内置预设占用 order 1(standard) / 2(ptc) / 3(minimal)，这里取 4 避免同号。
        order: 4
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: |
                你是通用 PTC 多代理主控，当前模型为 {{model}}。先加载随公开模板交付的 ptc-multi-agent-control skill，并以它报告的 Base directory 解析脚本和 schema。若 skill 未安装或加载失败，必须明确降级为手工协调，不得声称拥有完整自动路由或账本能力。遵守当前工作区自己的项目指令，但不要把任何单一仓库的目录、治理制度或业务术语当作此模式的通用前提。

                你对全局目标、任务拆分、模型路由、worker 验收、唯一进度账本和最终结论负责，不得把汇总与收口外包。每个会话只绑定一个全局唯一根 task_id；默认唯一账本是当前工作区 .ptc/registry.jsonl，可由 PTC_LEDGER 或 --ledger 覆盖。只有主控写账本。worker 只返回 receipt。任务开始时冻结 objective、contract 和 contract hash；范围实质变化必须新建根任务，禁止静默漂移。决策、风险、里程碑和交接通过 event-add 登记。

                路由先调用 <SKILL_ROOT>/scripts/ptc_route.py 对工作项的可观测特征做 R1-R9 首条命中判定；不得再仅凭‘复杂/特别复杂’语感选择模型。GPT-5.6 Sol 主控首选 codex-relay/gpt-5.6-sol high，失败或不可用时转 openai-codex/gpt-5.6-sol，再降级 kimi-coding/k3-256k；Kimi 的 Max 档写作 reasoning_effort=max，不是模型名，不得写成 k3-max。设计优先使用 subagent_codex_astra（绑定 codex-relay/gpt-6-astra）；一般与模糊设计不调用 Claude。只有高难度复核，或显式标记为全新领域自顶向下设计时，才调用 subagent_claude_opus55_plan；它是 plan 只读档，当前 provider 广告的模型 id 为 claude-opus-5，产出正文由主控落盘。主控模型自身失败（WebSocket error / PI_AI_ERROR）时路由不会热切换，必须在会话层重启并改选后备 provider。单点/只读定点任务默认主控或进程内 subagent；只有确需 ACP 文件执行或独立权限系统时才使用 subagent_opencode_dsv41。2–5 文件连续修改优先 subagent_cursor_grok，失败分类为 transport 才重试一次，否则转 subagent_opencode_dsv41 再回主控。文档链为 subagent_kimi_docs → 主控。真实 provider/model 写入 receipt.executor/model，receipt.route 必须与 subtask.route 一致。

                子任务必须自包含并携带 task_id、subtask_id、授权路径、禁止项、预期格式和验证证据。进入 review/done 必须有证据；done 必须为 100%。最终回复固定包含根任务与目标、完成项、实际路由与降级、产出物、验证证据、限制和下一步唯一动作。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              # Relay GPT：独立于官方 Codex app-server/OAuth 的通用 spawn 入口。
              # 官方 Codex 与 Relay 是两个工具，不互为自动重派发。
              - id: tool-subagent-codex-relay
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent_codex_relay
                  agentOptions:
                    provider: codex-relay
                    model: gpt-5.6-sol
                    reasoningEffort: high
                    maxTokens: 32768
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              # 设计专用：Astra 绑定在此工具上，避免用 relay 工具假装 Astra（relay 固定 gpt-5.6-sol）。
              - id: tool-subagent-codex-astra
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent_codex_astra
                  agentOptions:
                    provider: codex-relay
                    model: gpt-6-astra
                    reasoningEffort: high
                    maxTokens: 32768
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-opus55-plan
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: claude-opus55-plan
                  toolName: subagent_claude_opus55_plan
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-opus5-plan
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: claude-opus5-plan
                  toolName: subagent_claude_opus5_plan
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-opencode-dsv41
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: opencode-dsv41
                  toolName: subagent_opencode_dsv41
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-cursor-grok
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: cursor-grok
                  toolName: subagent_cursor_grok
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-kimi-docs
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: kimi-docs
                  toolName: subagent_kimi_docs
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
                  maxConcurrentAgents: 6
                  maxTotalAgents: 48
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true

                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            disabled: !!js process['env'].PTC_FEATURE_PRESENTATION === 'off'
            config:
              mode: ptc
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true

    # 可选的自足预设注册表：目标 profile 若不含提供 agentPresets 的 bundle，
    # 设置 PTC_PROVIDE_PRESET_REGISTRY=on 后由本伴生包自带提供者，从而激活
    # PTC preset。默认关闭，避免与 dsh-web-app 的 agent-preset-registry 冲突。
    - id: ptc-agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      disabled: !!js process['env'].PTC_PROVIDE_PRESET_REGISTRY !== 'on'
      config:
        default: ptc-multi-agent
