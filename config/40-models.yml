# ── 模型与路由 ───────────────────────────────────────────────────────────
# 新会话默认模型。改 DSHPACK_DEFAULT_PROVIDER / DSHPACK_DEFAULT_MODEL 即可换。
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: !!js process['env'].DSHPACK_DEFAULT_PROVIDER || 'codex-relay'
    model: !!js process['env'].DSHPACK_DEFAULT_MODEL || 'gpt-5.6-sol'

# ── llm-pi-ai 路由表 ─────────────────────────────────────────────────────
# 按 id 整体替换该行的 config。baseURL 与 apiKeyEnv 都可用环境变量覆盖，
# 因此同一份包能落在不同网络环境中。apiKeyEnv 只写变量名，值不入库。
#
# 注意：路由名与模型名必须在本机 DSH 内置目录中存在，否则该档位等于空转。
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      codex-relay:
        displayName: Codex Relay
        api: openai-responses
        baseURL: !!js process['env'].DSHPACK_BASE_CODEX_RELAY || 'http://47.101.159.7:39187/v1'
        apiKeyEnv: !!js process['env'].DSHPACK_KEY_CODEX_RELAY || 'CRS_OAI_KEY'
        models:
          - id: gpt-5.6-sol
            reasoningEfforts: { minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
          - id: gpt-6.1-sol
            # pi-ai 内置目录未收录该 id；按 gpt-6-sol / gpt-5.6-sol 同族声明档位（2026-10-20 起为默认档）
            reasoningEfforts: { minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
          - id: gpt-5.6
            reasoningEfforts: { minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
          - id: gpt-5.5
            reasoningEfforts: { minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
          - id: gpt-6-astra
            reasoningEfforts: { minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
      ais-2dsglm:
        displayName: AIS 2DSGLM
        api: openai-completions
        baseURL: !!js process['env'].DSHPACK_BASE_AIS || 'http://47.101.159.7:29988/v1'
        apiKeyEnv: !!js process['env'].DSHPACK_KEY_AIS || 'AIS_2DSGLM_API_KEY'
        models:
          - id: deepseek-v4.1-flash
          - id: deepseek-v4-flash
          - id: glm-5.3-flash
      anthropic-relay:
        displayName: Anthropic Relay
        api: anthropic-messages
        baseURL: !!js process['env'].DSHPACK_BASE_ANTHROPIC_RELAY || 'https://ai.orbitlink.me'
        apiKeyEnv: !!js process['env'].DSHPACK_KEY_ANTHROPIC_RELAY || 'CLAUDE_RELAY_TOKEN'
        models:
          - id: claude-opus-5
          - id: claude-opus-4-8
          - id: claude-sonnet-5
      # gpt（official）：OAuth 凭据，需在该设备 Web Models 页登录一次。
      openai-codex:
        displayName: gpt（official）
      kimi-coding:
        displayName: Kimi Coding
        apiKeyEnv: !!js process['env'].DSHPACK_KEY_KIMI || 'LLMKEY_KIMI'
      # OpenCode Go：沿用 DSH 内置目录模型清单。
      opencode-go:
        displayName: OpenCode Go
        apiKeyEnv: !!js process['env'].DSHPACK_KEY_OPENCODE || 'OPENCODE_API_KEY'

# ── 子智能体逐次模型选择（Host 偏好 subagent-model-selection-settings）────────
# 工具侧开关由 config/50-presets.yml 的 tool-subagent 提供（modelSelectionSettings: true）；
# 本行提供它所需的**已记录策略**：enabled + 非空精确路由白名单。缺本行时该能力对
# 模型不可见——subagent 工具只暴露 prompt / description / run_in_background。
#
# 白名单只列本包在上面声明过的 provider/model 精确对，覆盖 PTC 路由表的
# 控制 / 执行 / 设计三类及其降级项；不含路径、凭据或设备差异，可公开分发。
# 某台设备缺某条路由的凭据时，该条只显示为「已保存但当前不可用」，不影响其它路由。
#
# 逐设备的 route id 差异属于 failover 的 route-config.json，与 llm provider id 不是
# 同一命名空间，故本列表不随设备变化。确需覆盖时请新增专用环境变量，
# 不要复用 DSHPACK_ROUTE_*（那组是 failover 档位路由名）。
#
# 生效边界：只对**之后新建的顶层会话**生效；已有/恢复会话保持禁用。
- id: subagent-model-selection-settings
  name: "@deepseek-ai/dsh-tool-subagent/model-selection-settings"
  config:
    enabled: true
    allowedModels:
      - provider: codex-relay
        model: gpt-6.1-sol
      - provider: codex-relay
        model: gpt-6-astra
      - provider: openai-codex
        model: gpt-5.6-sol
      - provider: ais-2dsglm
        model: deepseek-v4.1-flash
      - provider: opencode-go
        model: deepseek-v4.1-flash
      - provider: kimi-coding
        model: k3-256k
      - provider: codex-relay
        model: gpt-5.6
      # Opus 降级链（5.5 -> 5 -> 4.8 -> 报告 Opus 不可用）。本包只声明 relay 的档位；
      # 5.5 由设备本地 provider 提供时，请在设备本地白名单补 tokeniss/claude-opus-5-5。
      - provider: anthropic-relay
        model: claude-opus-5
      - provider: anthropic-relay
        model: claude-opus-4-8
