# ── 模型与路由 ───────────────────────────────────────────────────────────
# 新会话默认模型。改 DSHPACK_DEFAULT_PROVIDER / DSHPACK_DEFAULT_MODEL 即可换。
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: !!js process['env'].DSHPACK_DEFAULT_PROVIDER || 'codex-relay'
    model: !!js process['env'].DSHPACK_DEFAULT_MODEL || 'gpt-6.1-sol'

# ── llm-pi-ai 路由表 ─────────────────────────────────────────────────────
# 按 id 整体替换该行的 config。下面每条 provider 的 baseURL / apiKeyEnv 必须写**字面量**，
# 不能写 !!js 表达式：DSH 把 !!js 留成 {__jsExpr} 对象，而 llm-pi-ai 在运行期的
# internal/config 钩子里按**未求值**原值跑 Config schema（apiKeyEnv 要求 string），
# 于是任何 provider 编辑都会报 "$.providers.<route>.apiKeyEnv expected string but got
# [object Object]"（2026-11-09 实测并修）。apiKeyEnv 只写变量名，值不入库。
# 设备差异放 device.env / device-answers.json / cordis.local.yml，由 migrate-providers.ps1
# 按字段合并并生成完整 profile 行；直接手写 profile 时仍须整行完整覆盖。
#
# 注意：路由名与模型名必须在本机 DSH 内置目录中存在，否则该档位等于空转。
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      codex-relay:
        displayName: Codex Relay
        api: openai-responses
        baseURL: http://47.101.159.7:39187/v1
        apiKeyEnv: CRS_OAI_KEY
        models:
          # 2026-10-21 上下文窗口声明规则（勿删）：pi-ai 内置目录未收录 codex-relay 的 id，
          # 未声明 contextWindow 时 DSH 回落 DEFAULT_CONTEXT_WINDOW=262144；当上游实际受理更大
          # prompt 时，pi-ai 的 usage 型静默溢出判定（stop 且 input+cacheRead > 声明窗口）会把
          # **成功**回答改判 CONTEXT_WINDOW_EXCEEDED，而 compaction 摘要要重放同一前缀、必撞同一
          # 判定 → 整轮失败（2026-10-21 实测：353,728 tokens 的会话收口被误杀）。
          # 新增 codex-relay 模型必须显式声明 contextWindow（取官方同 id 目录值；无依据的先实测）。
          # 取值来源：pi-ai dist/providers/data/openai-codex.json。
          - id: gpt-6.1-sol
            contextWindow: 500000
            # pi-ai 内置目录未收录该 id；按 gpt-6-sol / gpt-5.6-sol 同族声明档位（2026-10-20 起为默认档，目录首位）
            reasoningEfforts: { minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
          # 2026-11-12：按 relay /models 实测刷新。下列 id 均用最小 Responses 请求验证
          # status=completed；gpt-5.5 已从上游退役（404：retired from Codex with ChatGPT
          # sign-in on 2026-10-14），移出清单。gpt-5.4 / gpt-5.4-mini / gpt-5.2 虽在
          # /models 里，但对 ChatGPT 账号返回 model_not_found，未声明。gpt-6 的显示名是
          # "GPT-6 (Astra)"，保留为 gpt-6-astra 的别名。
          - id: gpt-6.1-terra
            contextWindow: 500000
            reasoningEfforts: { minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
          - id: gpt-5.6-sol
            contextWindow: 272000
            # 保留为可选档；不再作新会话默认、不再作 failover 目标
            reasoningEfforts: { minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
          - id: gpt-5.6-terra
            contextWindow: 272000
            reasoningEfforts: { minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
          - id: gpt-5.6-luna
            contextWindow: 272000
            reasoningEfforts: { minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
          - id: gpt-5.6
            contextWindow: 272000
            reasoningEfforts: { minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
          - id: gpt-6-sol
            contextWindow: 272000
            reasoningEfforts: { minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
          - id: gpt-6-astra
            contextWindow: 272000
            reasoningEfforts: { minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
          - id: gpt-6
            name: GPT-6 (Astra alias)
            contextWindow: 272000
            reasoningEfforts: { minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
          - id: gpt-6-luna
            contextWindow: 272000
            reasoningEfforts: { minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
          - id: codex-auto-review
            contextWindow: 272000
            reasoningEfforts: { minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
      ais-2dsglm:
        displayName: AIS 2DSGLM
        api: openai-completions
        baseURL: http://47.101.159.7:29988/v1
        apiKeyEnv: AIS_2DSGLM_API_KEY
        models:
          # 2026-11-12：按 endpoint /v1/models 实测刷新。目录新增 deepseek-v4.1-flash、
          # qwen3.8-flash，两者均用最小 chat 请求验证可用，reasoning_effort=high 也被接受。
          # - 原 deepseek-v4-flash 在中转站不存在（实际 id 是 deepseek-flash）；
          # - deepseek-v4.1-flash 仍不放进 failover tier2 的 models 列表：备用 key 的
          #   AxonHub profile 白名单可能不含它，422 invalid_model_error 不在切换面，会
          #   直接把回合打死；tier2 切换主模型保持 deepseek-flash；
          # - cc/ 前缀 id 是中转站给 Claude Code 客户端的别名，不加入 DSH 模型选择器。
          # reasoningEfforts 必须显式声明：pi-ai 目录里没有这些 id，省略会被当非推理模型。
          - id: deepseek-flash
            reasoningEfforts: { off: null, low: low, high: high, max: max }
          - id: deepseek-v4.1-flash
            reasoningEfforts: { off: null, low: low, high: high, max: max }
          - id: deepseek-v4-pro
            reasoningEfforts: { off: null, low: low, high: high, max: max }
          - id: qwen3.8-flash
            reasoningEfforts: { off: null, low: low, high: high, max: max }
          - id: glm-5.3-flash
      anthropic-relay:
        displayName: Anthropic Relay
        api: anthropic-messages
        baseURL: https://ai.orbitlink.me
        apiKeyEnv: CLAUDE_RELAY_TOKEN
        models:
          # 2026-11-12：按 relay /v1/models 实测刷新；opus-4-6 / opus-4-7 补入并用
          # /v1/messages 最小请求验证 stop_reason=end_turn。
          - id: claude-opus-4-6
          - id: claude-opus-4-7
          - id: claude-opus-5
          - id: claude-opus-4-8
          - id: claude-sonnet-5
      # gpt（official）：OAuth 凭据，需在该设备 Web Models 页登录一次。
      #
      # 2026-10-29：显式声明官方模型清单。DSH 0.2.0-rc.2 默认装的 pi-ai 0.87.1
      # 内置目录没有 gpt-6.1-sol（pi-ai 1.4.0 起才收录），而 `models` 是整体替换
      # 内置目录：不声明时该路由整体继承目录，选择器只显示 0.87.1 的 8 个旧 id，
      # 6.1 完全不可选。这里列出 0.87.1 ∪ 1.4.0 的全部官方 id：6.1 目录里没有，
      # 按 1.4.0 的 openai-codex-responses 条目声明窗口 500k / 输出 128k /
      # 文本+图片 / 全档位；其余条目省略字段，仍按同名目录条目继承
      # （升级 pi-ai 后若目录新增或下线模型，同步本列表）。
      openai-codex:
        displayName: gpt（official）
        models:
          - id: gpt-6.1-sol
            name: GPT-6.1 Sol
            contextWindow: 500000
            maxTokens: 128000
            input: [text, image]
            # 2026-10-30：**不要写 off: null**。DSH 的 resolveModelReasoning 把「off: null」
            # 从 thinkingLevelMap 里整键丢弃（只留 undefined），pi-ai 的 responses 适配器于是走
            # `model.thinkingLevelMap?.off ?? "none"` 回落——未选档位时发出
            # reasoning.effort="none"，而 gpt-6.1-sol 上游只认 low/medium/high/xhigh/max，
            # 整轮 400 "Unsupported value: 'none'"（2026-10-30 实测，见 CHANGELOG）。
            # 不声明 off 时 DSH 把 off 钉成 null，适配器直接不带 reasoning 参数（上游默认档），
            # 与上面 codex-relay 同 id 的声明一致。verify.mjs 会拦回 off。
            reasoningEfforts: { minimal: low, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
          # 2026-11-12：pi-ai 1.5.0 目录已收录 gpt-6.1-terra；按目录值（500k / 128k）补入。
          - id: gpt-6.1-terra
            name: GPT-6.1 Terra
            contextWindow: 500000
            maxTokens: 128000
            input: [text, image]
            reasoningEfforts: { minimal: low, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
          - id: gpt-6-sol
          - id: gpt-6-astra
          - id: gpt-6-luna
          - id: gpt-5.6-sol
          - id: gpt-5.6-terra
          - id: gpt-5.6-luna
          # 下面两个 id 仅在旧版 pi-ai（0.87.1）目录中存在；保留以兼容仍装旧版 pi-ai
          # 的设备。当前 Codex ChatGPT 账号已不再服务 gpt-5.5（2026-10-14 退役），新设备
          # 不必选它。
          - id: gpt-5.5
          - id: gpt-5.3-codex-spark
      # 2026-10-26 对齐 kimi 官网（models.dev kimi-code-plan-cn，api.kimi.com/coding）：
      # 新增 k3.1-pro / k3.1-pro-highspeed；kimi-for-coding 官网显示名改为 Kimi K2.8 Preview（id 不变）。
      kimi-coding:
        displayName: Kimi Coding
        apiKeyEnv: LLMKEY_KIMI
        models:
          - id: k3
            name: Kimi K3
            contextWindow: 1048576
            maxTokens: 131072
            input: [text, image]
            reasoningEfforts: { low: low, high: high, max: max }
          - id: k3-256k
            name: Kimi K3-256K
            contextWindow: 262144
            maxTokens: 131072
            input: [text, image]
            reasoningEfforts: { low: low, high: high, max: max }
          - id: kimi-for-coding
            name: Kimi K2.8 Preview
            contextWindow: 1048576
            maxTokens: 32768
            input: [text, image]
            reasoningEfforts: { low: low, high: high, max: max }
          - id: kimi-for-coding-highspeed
            name: Kimi For Coding HighSpeed
            contextWindow: 262144
            maxTokens: 32768
            input: [text, image]
            reasoningEfforts: { low: low, high: high, max: max }
          - id: k3.1-pro
            name: Kimi K3.1 Pro
            contextWindow: 1048576
            maxTokens: 131072
            input: [text, image]
            reasoningEfforts: { low: low, high: high, max: max }
          - id: k3.1-pro-highspeed
            name: Kimi K3.1 Pro Highspeed
            contextWindow: 1048576
            maxTokens: 131072
            input: [text, image]
            reasoningEfforts: { low: low, high: high, max: max }
          # Kimi API official current list (platform.kimi.ai/docs/models).
          - id: kimi-k2.7-code
            name: Kimi K2.7 Code
            contextWindow: 262144
            maxTokens: 131072
            input: [text, image]
            reasoningEfforts: { low: low, high: max, max: max }
          - id: kimi-k2.7-code-highspeed
            name: Kimi K2.7 Code HighSpeed
            contextWindow: 262144
            maxTokens: 131072
            input: [text, image]
            reasoningEfforts: { low: low, high: max, max: max }
          - id: kimi-k2.6
            name: Kimi K2.6
            contextWindow: 262144
            maxTokens: 131072
            input: [text, image]
            reasoningEfforts: { low: low, high: high, max: max }
      # OpenCode Go：固定当前 pi-ai 目录快照，避免设备之间因 pi-ai 版本不同而显示不同模型。
      # 来源：本机 @earendil-works/pi-ai opencode-go.json；升级 pi-ai 后需重新核对并发版。
      # 2026-11-13 复核：下表 30 个模型均存在于当前 pi-ai 目录，API/baseURL 等元数据由目录提供。
      # endpoint 额外返回的 hy4、longcat-2.5-free 不在当前目录，故未配置；
      # hy4-preview、longcat-2.0 是不同 ID，不可视为上述 endpoint ID 的别名。
      # 新增模型必须先核对目录元数据，不能仅依据 endpoint /models 的 ID 列表。
      # GENERATED by scripts/refresh-model-catalog.mjs --apply; source: current pi-ai opencode-go.json
      opencode-go:
        displayName: OpenCode Go
        apiKeyEnv: OPENCODE_API_KEY
        models:
          - id: beam-free
          - id: claude-haiku-5-5
          - id: deepseek-v4-pro
          - id: deepseek-v4.1-flash
          - id: gemini-4-argon
          - id: glm-5.2
          - id: glm-5.3
          - id: glm-5.3-flash
          - id: gpt-5.6-luna
          - id: gpt-6-luna
          - id: grok-4.7
          - id: hy3
          - id: hy4-preview
          - id: iceman-contributor-free
          - id: kimi-k2.7-code
          - id: kimi-k3
          - id: kimi-k3.1-pro
          - id: longcat-2.0
          - id: mimo-v2.5
          - id: mimo-v2.5-pro
          - id: mimo-v2.6-flash
          - id: mimo-v2.6-pro
          - id: minimax-m3
          - id: minimax-m3.1-flash
          - id: muse-spark-1.2-contributor
          - id: muse-spark-1.3-contributor
          - id: qwen3.7-plus
          - id: qwen3.8-flash
          - id: qwen3.8-max
          - id: step-5-preview
# ── 子智能体逐次模型选择（Host 偏好 subagent-model-selection-settings）────────
# 工具侧开关由 config/50-presets.yml 的 tool-subagent 提供（modelSelectionSettings: true）；
# 本行提供它所需的**已记录策略**：enabled + 非空精确路由白名单。缺本行时该能力对
# 模型不可见——subagent 工具只暴露 prompt / description / run_in_background。
#
# 白名单只列本包在上面声明过的 provider/model 精确对，覆盖 PTC 路由表的
# 控制 / 执行 / 设计三类及其降级项；不含路径、凭据或设备差异，可公开分发。
# 某台设备缺某条路由的凭据时，该条只显示为「已保存但当前不可用」，不影响其它路由。
#
# 逐设备的 route id 差异属于 failover 的 route-config.json，与 llm provider id 不是
# 同一命名空间，故本列表不随设备变化。确需覆盖时请新增专用环境变量，
# 不要复用 DSHPACK_ROUTE_*（那组是 failover 档位路由名）。
#
# 生效边界：只对**之后新建的顶层会话**生效；已有/恢复会话保持禁用。
- id: subagent-model-selection-settings
  name: "@deepseek-ai/dsh-tool-subagent/model-selection-settings"
  config:
    enabled: true
    allowedModels:
      - provider: codex-relay
        model: gpt-6.1-sol
      - provider: codex-relay
        model: gpt-6-astra
      - provider: openai-codex
        model: gpt-6.1-sol
      - provider: ais-2dsglm
        model: deepseek-flash
      - provider: ais-2dsglm
        model: deepseek-v4-pro
      - provider: opencode-go
        model: deepseek-v4.1-flash
      - provider: kimi-coding
        model: k3-256k
      - provider: kimi-coding
        model: k3.1-pro
      - provider: kimi-coding
        model: k3.1-pro-highspeed
      - provider: kimi-coding
        model: kimi-k2.7-code
      - provider: kimi-coding
        model: kimi-k2.7-code-highspeed
      - provider: kimi-coding
        model: kimi-k2.6
      - provider: codex-relay
        model: gpt-5.6
      # Opus 降级链（5.5 -> 5 -> 4.8 -> 报告 Opus 不可用）。本包只声明 relay 的档位；
      # 5.5 由设备本地 provider 提供时，请在设备本地白名单补 tokeniss/claude-opus-5-5。
      - provider: anthropic-relay
        model: claude-opus-5
      - provider: anthropic-relay
        model: claude-opus-4-8
