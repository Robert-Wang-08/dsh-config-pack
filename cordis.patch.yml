# dsh-config-pack v0.10.1 — GENERATED FILE, DO NOT EDIT.
#
# Source of truth: config/*.yml   Rebuild with: npm run build
# Verify before publishing:       npm run verify
#
# 本文件是 DSH 的 profile patch 补丁层，由本包作为 bundle 提供。
# 补丁语义（见 @deepseek-ai/dsh-base）：
#   - 顶层 `- id: X` + config 会**整体替换** X 行的 config，不是合并；
#   - `- insert:` 追加新行；
#   - 后续组合包层与用户的 profile cordis.patch.yml 按 id 覆盖，**最后一次写入生效**；
#   - 因此用户 profile 里若还留着同 id 的内联块，本文件对那一行就是死码。
#
# !!js 表达式写法约束（YAML 硬约束，不是风格问题）：
#   - 写成不含「冒号加空格」的普通标量；
#   - 不要以引号 / { / [ / ! 开头；
#   - 否则块状上下文会把它当成映射键或标签解析。

# ═══ config/10-subagents.yml ════════════════════════════════════════
# ── 外部子代理 ───────────────────────────────────────────────────────────
# ACP provider 行：opencode / kimi / cursor（本包 owns）。
# PTC 专用的 opencode-dsv41 / kimi-docs / cursor-grok 由 ptc-multi-agent-control
# 的 dsh-bundle 提供（见 pack.manifest.yaml -> delegated），本包不得同 id 声明。
#
# Windows 注意：opencode 与 cursor-agent 在 PATH 上只有 .cmd/.ps1 shim，没有 .exe，
# 裸名 spawn 会失败并停在 ACP initialize/transport。必须经 cmd /c（POSIX 用 sh -c）包装。
# kimi 是真实 exe，可直接 spawn。
#
# !!js 写法硬约束（YAML 层，不是风格）：表达式里不能出现「冒号加空格」，
# 因此**禁用三元运算符**——`? 'a' : 'b'` 会被 YAML 当成映射键，直接解析失败。
# 统一改写为 `(cond && 'a') || 'b'`（分支值均为真值时可安全降级）。
# 同时不要以引号 / { / [ / ! 开头。

- insert:
    # opencode：默认让 AIS 2DSGLM 的 DeepSeek V4.1 Flash 承担原子查询/修改。
    # opencode acp 不接受 --model，只能靠 OPENCODE_CONFIG_CONTENT 注入（与用户配置是合并语义）。
    # 模型 id 必须用 OpenCode 自己的 provider id（ais1dsglm），不是本包 DSH 侧的 llm-pi-ai 路由名
    # （ais-2dsglm，见 config/40-models.yml）——两者命名空间不同，混用会让 OpenCode 解析不到模型。
    - id: subagent-acp-opencode
      name: '@local/dsh-subagent-acp-resilient'
      disabled: !!js process['env'].DSHPACK_ACP_OPENCODE === 'off'
      config:
        providerName: opencode
        command: !!js (process.platform === 'win32' && 'cmd') || 'sh'
        args:
          - !!js (process.platform === 'win32' && '/c') || '-c'
          - !!js (process.platform === 'win32' && 'opencode acp') || 'exec opencode acp'
        permission: allow
        startupTimeoutMs: 120000
        idleTimeoutMs: 300000
        absoluteTimeoutMs: 1800000
        activityExtensionMs: 60000
        recoverySettleMs: 5000
        env:
          OPENCODE_CONFIG_CONTENT: !!js process['env'].DSHPACK_OPENCODE_CONFIG || '{"model":"ais1dsglm/deepseek-v4.1-flash"}'
          # 默认数据目录在 ~/.local/share/opencode；workspace-write 会拒绝该目录。
          # 临时状态改落工作区 .ptc/acp-tmp（可用 PTC_ACP_TMP 覆盖根目录）。
          XDG_DATA_HOME: !!js process['env'].PTC_ACP_TMP || ((process['env'].DSH_WORKSPACE || process.cwd()) + '/.ptc/acp-tmp/opencode')

    - id: subagent-acp-kimi
      name: '@local/dsh-subagent-acp-resilient'
      disabled: !!js process['env'].DSHPACK_ACP_KIMI === 'off'
      config:
        providerName: kimi
        command: kimi
        args: [ '--model', kimi-code/k3-256k, acp ]
        permission: allow
        startupTimeoutMs: 120000
        idleTimeoutMs: 300000
        absoluteTimeoutMs: 1800000
        activityExtensionMs: 60000
        recoverySettleMs: 5000
        # KIMI_CODE_HOME 同时承载凭据和会话。仅显式设置 PTC_ACP_TMP 时启用重定向；
        # 启用前需运行 ptc-multi-agent-control/scripts/acp_workspace_tmp.py 预置凭据链接/副本。
        env:
          KIMI_CODE_HOME: !!js process['env'].PTC_ACP_TMP && ((process['env'].DSH_WORKSPACE || process.cwd()) + '/.ptc/acp-tmp/kimi-home') || ''

    # cursor：默认关闭。cursor-agent 的代理路径把 HTTP/2 ping 超时写死 5s，经代理时传输不稳；
    # 下面把 cursor 域名追加进小写 no_proxy（cursor-agent 只读小写，且按 host 后缀匹配）。
    #   DSHPACK_CURSOR_KEEP_PROXY 为真 -> 沿用调用方的 no_proxy，未设时用默认 localhost,127.0.0.1,::1；
    #   否则 -> 在现有列表后补上 cursor.sh；
    # 空字符串视为未设置。用数组拼接而非三元，规避冒号加空格。
    - id: subagent-acp-cursor
      name: '@local/dsh-subagent-acp-resilient'
      disabled: !!js process['env'].DSHPACK_ACP_CURSOR !== 'on'
      config:
        providerName: cursor
        command: !!js (process.platform === 'win32' && 'cmd') || 'sh'
        args:
          - !!js (process.platform === 'win32' && '/c') || '-c'
          - !!js (process.platform === 'win32' && 'cursor-agent --model auto acp') || 'exec cursor-agent --model auto acp'
        permission: allow
        startupTimeoutMs: 120000
        idleTimeoutMs: 300000
        absoluteTimeoutMs: 1800000
        activityExtensionMs: 60000
        recoverySettleMs: 5000
        env:
          no_proxy: !!js process['env'].DSHPACK_CURSOR_KEEP_PROXY && (process['env'].no_proxy||'localhost,127.0.0.1,::1') || (process['env'].no_proxy||'').split(',').concat('cursor.sh').filter(Boolean).join(',')

# ── 产品子代理：全权（bypass）覆盖 ───────────────────────────────────────
# claude-code / codex 的 provider 行由各自 bundle 注册；这里在其后按顶层 id 定向覆盖 config。
# subagent_codex_relay 复用 dsh-subagent-spawn-in-process 的通用执行器，
# 通过工具配置的 agentOptions 绑定 llm-pi-ai 的 codex-relay/gpt-6.1-sol；
# 它不加载 @deepseek-ai/dsh-subagent-codex，也不使用 OpenAI OAuth。
# 必须写成顶层行，不能放进上面的 insert 列表，否则重复 id。
- id: subagent-claude-code
  config:
    permissionMode: bypassPermissions

- id: subagent-codex
  config:
    permissionMode: dangerously-bypass-approvals-and-sandbox

# ═══ config/20-mcp.yml ══════════════════════════════════════════════
# ── MCP 服务器 ───────────────────────────────────────────────────────────
# 默认全部关闭（ticktick 在配置了入口路径时自动开）。用 DSHPACK_MCP_* 开关打开。
# 关闭直接写在 insert 行自己的 disabled 上，而不是「先插后禁」两层——单层即可生效。

- insert:
    # 本地 stdio：codegraph
    - id: mcp-codegraph
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js process['env'].DSHPACK_MCP_CODEGRAPH !== 'on'
      config:
        serverName: codegraph
        transport: stdio
        command: !!js process['env'].DSHPACK_CODEGRAPH_CMD || 'codegraph-mcp'
        args: []

    # 本地 stdio：ticktick。入口是 JS 文件，必须给出 node 与脚本两个绝对路径。
    # 两者都是本机差异点；未配置入口时该行自动禁用。
    - id: mcp-ticktick
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js process['env'].DSHPACK_TICKTICK_ENTRY === undefined
      config:
        serverName: ticktick
        transport: stdio
        command: !!js process['env'].DSHPACK_NODE || 'node'
        args:
          - !!js process['env'].DSHPACK_TICKTICK_ENTRY || ''

    # 远程 Streamable HTTP：腾讯文档 / 腾讯幻灯片。Authorization 从环境变量读取，不落盘。
    - id: mcp-tencent-docs
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js process['env'].DSHPACK_MCP_TENCENT_DOCS !== 'on'
      config:
        serverName: tencent-docs
        transport: streamable-http
        url: https://docs.qq.com/openapi/mcp
        headers:
          Authorization: !!js process['env'].TENCENT_DOCS_TOKEN || ''

    - id: mcp-slide
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js process['env'].DSHPACK_MCP_SLIDE !== 'on'
      config:
        serverName: slide-mcp
        transport: streamable-http
        url: https://docs.qq.com/api/v6/slide/mcp
        headers:
          Authorization: !!js process['env'].TENCENT_DOCS_TOKEN || ''

# ═══ config/30-ui.yml ═══════════════════════════════════════════════
# ── 宿主 UI 接线 ─────────────────────────────────────────────────────────

# 目录选择器：默认的 -auto 在 win32 + loopback 下解析为 native，对话框会被压在浏览器后面。
# 改为页面内 -browse 版。该接缝只服务一个 directoryPicker slot，-auto 必须 disabled
# 而不是与 -browse 并存（并存会 duplicate-service 启动失败）。
# 想恢复自适应行为：删掉下面三行与紧邻的 insert 块。
- id: directory-picker
  disabled: true

- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'

- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: !!js process['env'].DSHPACK_WELCOME_NOTICE || '2026-09-28.1'

# ═══ config/40-models.yml ═══════════════════════════════════════════
# ── 模型与路由 ───────────────────────────────────────────────────────────
# 新会话默认模型。改 DSHPACK_DEFAULT_PROVIDER / DSHPACK_DEFAULT_MODEL 即可换。
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: !!js process['env'].DSHPACK_DEFAULT_PROVIDER || 'codex-relay'
    model: !!js process['env'].DSHPACK_DEFAULT_MODEL || 'gpt-6.1-sol'

# ── llm-pi-ai 路由表 ─────────────────────────────────────────────────────
# 按 id 整体替换该行的 config。baseURL 与 apiKeyEnv 都可用环境变量覆盖，
# 因此同一份包能落在不同网络环境中。apiKeyEnv 只写变量名，值不入库。
#
# 注意：路由名与模型名必须在本机 DSH 内置目录中存在，否则该档位等于空转。
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      codex-relay:
        displayName: Codex Relay
        api: openai-responses
        baseURL: !!js process['env'].DSHPACK_BASE_CODEX_RELAY || 'http://47.101.159.7:39187/v1'
        apiKeyEnv: !!js process['env'].DSHPACK_KEY_CODEX_RELAY || 'CRS_OAI_KEY'
        models:
          # 2026-10-21 上下文窗口声明规则（勿删）：pi-ai 内置目录未收录 codex-relay 的 id，
          # 未声明 contextWindow 时 DSH 回落 DEFAULT_CONTEXT_WINDOW=262144；当上游实际受理更大
          # prompt 时，pi-ai 的 usage 型静默溢出判定（stop 且 input+cacheRead > 声明窗口）会把
          # **成功**回答改判 CONTEXT_WINDOW_EXCEEDED，而 compaction 摘要要重放同一前缀、必撞同一
          # 判定 → 整轮失败（2026-10-21 实测：353,728 tokens 的会话收口被误杀）。
          # 新增 codex-relay 模型必须显式声明 contextWindow（取官方同 id 目录值；无依据的先实测）。
          # 取值来源：pi-ai dist/providers/data/openai-codex.json。
          - id: gpt-6.1-sol
            contextWindow: 500000
            # pi-ai 内置目录未收录该 id；按 gpt-6-sol / gpt-5.6-sol 同族声明档位（2026-10-20 起为默认档，目录首位）
            reasoningEfforts: { minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
          - id: gpt-5.6-sol
            contextWindow: 272000
            # 保留为可选档；不再作新会话默认、不再作 failover 目标
            reasoningEfforts: { minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
          - id: gpt-5.6
            contextWindow: 272000
            reasoningEfforts: { minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
          - id: gpt-5.5
            contextWindow: 272000
            reasoningEfforts: { minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
          - id: gpt-6-astra
            contextWindow: 272000
            reasoningEfforts: { minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
      ais-2dsglm:
        displayName: AIS 2DSGLM
        api: openai-completions
        baseURL: !!js process['env'].DSHPACK_BASE_AIS || 'http://47.101.159.7:29988/v1'
        apiKeyEnv: !!js process['env'].DSHPACK_KEY_AIS || 'AIS_2DSGLM_API_KEY'
        models:
          - id: deepseek-v4.1-flash
          - id: deepseek-v4-flash
          - id: glm-5.3-flash
      anthropic-relay:
        displayName: Anthropic Relay
        api: anthropic-messages
        baseURL: !!js process['env'].DSHPACK_BASE_ANTHROPIC_RELAY || 'https://ai.orbitlink.me'
        apiKeyEnv: !!js process['env'].DSHPACK_KEY_ANTHROPIC_RELAY || 'CLAUDE_RELAY_TOKEN'
        models:
          - id: claude-opus-5
          - id: claude-opus-4-8
          - id: claude-sonnet-5
      # gpt（official）：OAuth 凭据，需在该设备 Web Models 页登录一次。
      openai-codex:
        displayName: gpt（official）
      kimi-coding:
        displayName: Kimi Coding
        apiKeyEnv: !!js process['env'].DSHPACK_KEY_KIMI || 'LLMKEY_KIMI'
      # OpenCode Go：沿用 DSH 内置目录模型清单。
      opencode-go:
        displayName: OpenCode Go
        apiKeyEnv: !!js process['env'].DSHPACK_KEY_OPENCODE || 'OPENCODE_API_KEY'

# ── 子智能体逐次模型选择（Host 偏好 subagent-model-selection-settings）────────
# 工具侧开关由 config/50-presets.yml 的 tool-subagent 提供（modelSelectionSettings: true）；
# 本行提供它所需的**已记录策略**：enabled + 非空精确路由白名单。缺本行时该能力对
# 模型不可见——subagent 工具只暴露 prompt / description / run_in_background。
#
# 白名单只列本包在上面声明过的 provider/model 精确对，覆盖 PTC 路由表的
# 控制 / 执行 / 设计三类及其降级项；不含路径、凭据或设备差异，可公开分发。
# 某台设备缺某条路由的凭据时，该条只显示为「已保存但当前不可用」，不影响其它路由。
#
# 逐设备的 route id 差异属于 failover 的 route-config.json，与 llm provider id 不是
# 同一命名空间，故本列表不随设备变化。确需覆盖时请新增专用环境变量，
# 不要复用 DSHPACK_ROUTE_*（那组是 failover 档位路由名）。
#
# 生效边界：只对**之后新建的顶层会话**生效；已有/恢复会话保持禁用。
- id: subagent-model-selection-settings
  name: "@deepseek-ai/dsh-tool-subagent/model-selection-settings"
  config:
    enabled: true
    allowedModels:
      - provider: codex-relay
        model: gpt-6.1-sol
      - provider: codex-relay
        model: gpt-6-astra
      - provider: openai-codex
        model: gpt-6.1-sol
      - provider: openai-codex
        model: gpt-5.6-sol
      - provider: ais-2dsglm
        model: deepseek-v4.1-flash
      - provider: opencode-go
        model: deepseek-v4.1-flash
      - provider: kimi-coding
        model: k3-256k
      - provider: codex-relay
        model: gpt-5.6
      # Opus 降级链（5.5 -> 5 -> 4.8 -> 报告 Opus 不可用）。本包只声明 relay 的档位；
      # 5.5 由设备本地 provider 提供时，请在设备本地白名单补 tokeniss/claude-opus-5-5。
      - provider: anthropic-relay
        model: claude-opus-5
      - provider: anthropic-relay
        model: claude-opus-4-8

# ═══ config/45-failover.yml ═════════════════════════════════════════
# ── Provider 故障转移（dsh-deepseek-keypool）──────────────────────────────
# 完整 config 覆盖：插件自身的 cordis.patch.yml 只 insert 空 Host 行；
# 旧 SkillHub failover-tiers bundle 的完整档位表迁入本包后由本文件发布。
# 补丁按 id 整体替换 config（非合并）；装本包后须删掉 profile / 旧 bundle 里
# 同 id 的内联覆盖，否则本文件是死码。
#
# 路由 id 因设备而异（至少 DeepSeek 备用路由：本机 opencode-go，另一台 opencodego）。
# 全部 route 用 DSHPACK_ROUTE_* 覆盖；默认值见 pack.manifest.yaml requires_env。
# 绝不要把 API 密钥写进本文件。
# 本插件的 agent/request 与 agent/request-error 只服务主控 LLM 请求；
# 不把 subagent_codex 的工具失败误当成主控失败，也不负责子代理跨 provider 重派发。
# subagent_codex_relay 是独立工具入口，不能通过本档位表伪装成官方 Codex fallback。

- id: dsh-deepseek-keypool
  config:
    enabled: true
    # 传输层兜底：宿主只把完全匹配 `WebSocket closed unexpectedly` 归一化为
    # TRANSPORT，带关闭码的文案会落到通用 PI_AI_ERROR，必须靠消息模式兜底。
    terminalCodes:
      [
        QUOTA,
        AUTH,
        INVALID_CREDENTIAL,
        MISSING_CREDENTIAL,
        NO_ADAPTER,
        SERVER,
        RATE_LIMIT,
        TRANSPORT
      ]
    failurePatterns:
      - insufficient balance
      - insufficient_quota
      - quota exceeded
      - usage limit
      - usage_limit
      - balance
      - overloaded
      - invalid api key
      - token limit
      - rate limit
      - websocket closed
      - websocket
      - connection closed
      - socket hang up
      - ECONNRESET
      - premature close
    minSwitchIntervalMs: 1000
    maxSwitchesPerTurn: 6
    probeTarget: true
    keyResetAt: '06:00'
    policyMode: same
    maxPolicyRetriesPerStep: 2
    # 按失败类别的重试策略（切换 provider 之前的原地重试）。未列出的错误码一律立即切换，
    # 保持旧语义，也保证额度类不会因为“默认值”被改成先重试。
    #   TRANSPORT  连接/流中断（WebSocket error、socket hang up…）：等 5s 重试，5 次或 30s 预算用尽才切换；
    #              observationWindowMs 内（连接活过 30s 才断）按“意外中断”处理，活过窗口外直接切换。
    #   RATE_LIMIT 服务端限流：退避 15s 重试，3 次或 60s 预算。
    #   SERVER     上游 5xx：3s 重试 2 次或 15s 预算。
    #   QUOTA/AUTH/INVALID_CREDENTIAL/MISSING_CREDENTIAL/NO_ADAPTER：额度与凭据类，attempts 0 = 立即切换。
    retryPolicies:
      TRANSPORT:
        attempts: 5
        delayMs: 5000
        budgetMs: 30000
        observationWindowMs: 30000
      RATE_LIMIT:
        attempts: 3
        delayMs: 15000
        budgetMs: 60000
      SERVER:
        attempts: 2
        delayMs: 3000
        budgetMs: 15000
      QUOTA: { attempts: 0 }
      AUTH: { attempts: 0 }
      INVALID_CREDENTIAL: { attempts: 0 }
      MISSING_CREDENTIAL: { attempts: 0 }
      NO_ADAPTER: { attempts: 0 }
    # 失败原因细分（可选，只影响提示文案，不改变切换/重试行为）。
    # 插件内置中英文词条（余额不足 / 无权访问模型 / invalid api key …），这里只能**追加**；
    # 同一个 AUTH 码下「余额不足」与「该令牌无权访问模型」的处置不同（充值 vs 换来源），
    # 内置表已覆盖实测文案，通常无需配置。键为原因 id，值为追加的模式串数组：
    # failureReasons:
    #   QUOTA_EXHAUSTED: [ 试用额度已耗尽 ]
    #   MODEL_NOT_AUTHORIZED: [ 未开通该模型 ]
    # 启动对齐关闭：新会话保持宿主默认/最近一次选择（agent-default-model）。
    startup:
      preferTier: 0
    # declared = 固定档内顺序；keywords 会让「先试哪个」随失败上下文漂移。
    ranking:
      mode: declared
      timeoutMs: 20000
      cacheTtlMs: 60000
      # 同族互备优先：失败路由能在档位表中定位时，先只在它所在档内切换，档内确实
      # 无可用候选（已尝试/冷却中/能力不兼容/不可解析）才退回「从第 1 档向上扫」。
      # 打开后：opencode-go 失败先切同档的 ais-2dsglm（同为 deepseek-v4.1-flash），
      # 不再直接升到第 1 档的 gpt-6.1-sol；整档耗尽才升档。
      # 关闭（默认 false）时保持 v3.4.0 旧语义。
      sameTierFirst: true
    # 档位按模型族对齐：同档条目是同 model 的备用路由。
    # 说明：sameTierFirst=true 时低档失败优先在本档内互备；该档整体耗尽才升到第 1 档
    # （因此同一时刻仍是“一个族受益”，但受益者是失败方所在的族）。
    tiers:
      - tier: 1
        enabled: true
        entries:
          - id: codex-relay
            route: !!js process['env'].DSHPACK_ROUTE_CODEX_RELAY || 'codex-relay'
            model: gpt-6.1-sol
            description: 主控主力；reasoning 档可调，适合复杂推理
            keywords: [ 推理, 复杂, reasoning ]
            compatible: { tools: true, images: true }
            cooldownMs: 60000
          - id: codex-official
            route: !!js process['env'].DSHPACK_ROUTE_OPENAI_CODEX || 'openai-codex'
            model: gpt-6.1-sol
            description: 同族备用；gpt（official），OAuth 凭据，需先在 Web Models 页登录
            keywords: [ 官方, codex ]
            compatible: { tools: true, images: true }
            cooldownMs: 120000
      - tier: 2
        enabled: true
        entries:
          - id: ais
            route: !!js process['env'].DSHPACK_ROUTE_AIS || 'ais-2dsglm'
            model: deepseek-v4.1-flash
            description: 第二族主力；OpenAI 兼容协议，支持文本与图片
            keywords: [ 主力, 便宜, 稳定 ]
            compatible: { tools: true, images: true }
            cooldownMs: 60000
          - id: opencodego
            route: !!js process['env'].DSHPACK_ROUTE_OPENCODE || 'opencode-go'
            model: deepseek-v4.1-flash
            description: 同族备用；沿用内置目录模型清单（另一设备 route 可能是 opencodego）
            keywords: [ 默认, 保底 ]
            compatible: { tools: true, images: true }
            cooldownMs: 60000
      - tier: 3
        enabled: true
        entries:
          - id: kimi
            route: !!js process['env'].DSHPACK_ROUTE_KIMI || 'kimi-coding'
            model: k3-256k
            description: 跨族保底；长上下文代码场景
            keywords: [ 长上下文, k3 ]
            compatible: { tools: true, images: false }
            cooldownMs: 60000
      - tier: 4
        enabled: false
        entries:
          - id: deepseek-official
            route: !!js process['env'].DSHPACK_ROUTE_DEEPSEEK_OFFICIAL || 'deepseek-official'
            model: deepseek-flash
            description: DeepSeek 官网直连；本机无该路由模型声明，保持禁用
            keywords: [ 官网, 直连 ]
            compatible: { tools: true, images: true }
            cooldownMs: 120000

# ═══ config/50-presets.yml ══════════════════════════════════════════
# ── 预设行 ───────────────────────────────────────────────────────────────
#
# preset-standard-codex 是 DSH 0.2 之前的目录式预设（$DSH_HOME/.agent-presets/<id>/）。
# 0.2 起不再扫描该目录，因此改为普通 @deepseek-ai/dsh-agent-preset 行声明，
# 供历史会话与其归档子会话按名继续引用。本块自本机 web profile 逐行搬入，内容未改。
#
# 多代理预设 preset-ptc-multi-agent 不在这里——它由 ptc-multi-agent-control 的 dsh-bundle 提供，
# 避免同一个 preset id 被两个组件同时声明。

- insert:
    - id: preset-standard-codex
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: standard-codex
        name: 标准模式 + Codex
        description: 标准编码 Agent，并把 Codex、Claude Code、OpenCode、Kimi Code 四个外部子代理全部暴露给模型。
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              # Official Codex remains the OAuth/app-server path.
              - id: tool-subagent-codex-relay
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent_codex_relay
                  agentOptions:
                    provider: codex-relay
                    model: gpt-6.1-sol
                    reasoningEffort: high
                    maxTokens: 32768
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-opencode
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: opencode
                  toolName: subagent_opencode
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-kimi
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: kimi
                  toolName: subagent_kimi
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true

# ═══ config/60-registry.yml ═════════════════════════════════════════
# ── 预设注册表 ───────────────────────────────────────────────────────────
# selectedDefault 决定新会话默认用哪个预设。
# 默认 standard（DSH 内置）；本包场景默认指向本机常用的多代理预设。

- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: !!js process['env'].DSHPACK_SELECTED_PRESET || 'ptc-multi-agent'
