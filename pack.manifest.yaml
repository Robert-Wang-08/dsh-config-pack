# dsh-config-pack 自描述清单
# ---------------------------------------------------------------------------
# 本文件是"包对自己主张什么"的唯一声明处。安装/校验脚本只读它，不猜。
schema: dsh-pack/v1
name: dsh-config-pack
version: 0.8.0
requires_dsh: ">=0.2.0-rc.2 <0.3.0"

# 本包独占的行 id。任何其它层（别的 bundle、目标 profile 的 cordis.patch.yml）
# 一旦声明同 id，就会遮蔽本包（profile patch 是最后一层，按 id 覆盖、后写胜）。
# verify.mjs 命中即报错退出。
owns:
  - subagent-acp-opencode
  - subagent-acp-kimi
  - subagent-acp-cursor
  - subagent-claude-code
  - subagent-codex
  - tool-subagent-codex-relay
  - mcp-codegraph
  - mcp-ticktick
  - mcp-tencent-docs
  - mcp-slide
  - directory-picker
  - directory-picker-browse
  - ui-directory-picker-browse
  - agent-default-model
  - llm-pi-ai
  - subagent-model-selection-settings
  - ui-settings-general
  - preset-standard-codex
  - agent-preset-registry
  - dsh-deepseek-keypool

# 本包会启用/禁用的插件开关（默认值写在 config/*.yml 的 !!js 表达式里）。
# 设为任意非空值即翻转。改完必须重启 DSH——环境变量不会进入已运行的进程。
switches:
  - { name: DSHPACK_ACP_OPENCODE, default: "on",  effect: "启用 ACP 子代理 opencode" }
  - { name: DSHPACK_ACP_KIMI,     default: "on",  effect: "启用 ACP 子代理 kimi" }
  - { name: DSHPACK_ACP_CURSOR,   default: "off", effect: "启用 ACP 子代理 cursor-agent" }
  - { name: DSHPACK_MCP_CODEGRAPH,   default: "off", effect: "启用 codegraph MCP" }
  - { name: DSHPACK_MCP_TENCENT_DOCS, default: "off", effect: "启用腾讯文档 MCP（需 TENCENT_DOCS_TOKEN）" }
  - { name: DSHPACK_MCP_SLIDE,       default: "off", effect: "启用腾讯幻灯片 MCP（需 TENCENT_DOCS_TOKEN）" }
  - { name: DSHPACK_MCP_TICKTICK,    default: "off", effect: "启用 TickTick MCP（需 DSHPACK_TICKTICK_ENTRY）" }

# 本机差异点，必须逐台设置；只登记名字与用途，绝不含值。
requires_env:
  - { name: DSHPACK_NODE,            scope: User, required: false, why: "MCP stdio 用的 node 绝对路径；不设则用 PATH 上的 node" }
  - { name: DSHPACK_TICKTICK_ENTRY,  scope: User, required: false, why: "ticktick-mcp 的 dist/index.js 绝对路径；未设则 ticktick 行被禁用" }
  - { name: DSHPACK_OPENCODE_CONFIG, scope: User, required: false, why: "覆盖 OPENCODE_CONFIG_CONTENT JSON；默认 ais-2dsglm/deepseek-v4.1-flash" }
  - { name: DSHPACK_DEFAULT_PROVIDER, scope: User, required: false, why: "新会话默认 provider；默认 codex-relay" }
  - { name: DSHPACK_DEFAULT_MODEL,   scope: User, required: false, why: "新会话默认 model；默认 gpt-5.6-sol" }
  - { name: DSHPACK_SELECTED_PRESET, scope: User, required: false, why: "预设注册表 selectedDefault；默认 ptc-multi-agent" }
  - { name: DSHPACK_ROUTE_CODEX_RELAY,        scope: User, required: false, why: "failover tier1 主路由 id；默认 codex-relay" }
  - { name: DSHPACK_ROUTE_OPENAI_CODEX,       scope: User, required: false, why: "failover tier1 备用路由 id；默认 openai-codex" }
  - { name: DSHPACK_ROUTE_AIS,               scope: User, required: false, why: "failover tier2 主路由 id；默认 ais-2dsglm" }
  - { name: DSHPACK_ROUTE_OPENCODE,          scope: User, required: false, why: "failover tier2 DeepSeek 备用路由 id；默认 opencode-go（另一设备可能是 opencodego）" }
  - { name: DSHPACK_ROUTE_KIMI,              scope: User, required: false, why: "failover tier3 路由 id；默认 kimi-coding" }
  - { name: DSHPACK_ROUTE_DEEPSEEK_OFFICIAL, scope: User, required: false, why: "failover tier4 路由 id；默认 deepseek-official（档位默认禁用）" }
  - { name: TENCENT_DOCS_TOKEN,      scope: User, required: false, why: "腾讯文档 MCP 的 Authorization" }
  - { name: CRS_OAI_KEY,             scope: User, required: true,  why: "codex-relay 路由凭据" }
  - { name: AIS_2DSGLM_API_KEY,      scope: User, required: false, why: "ais-2dsglm 路由凭据" }
  - { name: CLAUDE_RELAY_TOKEN,      scope: User, required: false, why: "anthropic-relay 路由凭据" }
  - { name: LLMKEY_KIMI,             scope: User, required: false, why: "kimi-coding 路由凭据" }
  - { name: OPENCODE_API_KEY,        scope: User, required: false, why: "opencode-go 路由凭据" }

# CLI 登录态：装不了，只能逐台确认。
requires_cli:
  - { cmd: codex,        probe: "codex --version",        auth: "自定义 provider 用 CRS_OAI_KEY；官网另用 codex-auth" }
  - { cmd: cursor-agent, probe: "cursor-agent status",    auth: "cursor-agent login" }
  - { cmd: opencode,     probe: "opencode --version",     auth: "凭据在 <XDG_DATA_HOME>/opencode/auth.json，勿改 XDG_DATA_HOME" }
  - { cmd: kimi,         probe: "kimi --version",         auth: "kimi 自身登录态" }
  - { cmd: claude,       probe: "claude --version",       auth: "Claude Code 自身登录态" }

# 绝不跨设备复制。
never_sync:
  - { path: "%USERPROFILE%/.dsh/.credentials.yaml", reason: "含明文密钥" }
  - { path: "%USERPROFILE%/.dsh/sessions",          reason: "本机会话历史，与设备绑定" }
  - { path: "<local-companion>/",                    reason: "生成的 PTC 本机伴生配置；目录内自带 deny-by-default .gitignore" }

public_companion:
  schema: ptc-public-companion/v1
  template: templates/ptc-public-companion
  bundle: templates/ptc-public-companion/dsh-bundle
  skill: packages/dsh-ptc-multi-agent-mode
  skill_version: 0.15.0
  contract_rows: 12
  generated_artifacts: 9
  consumption_map: templates/ptc-public-companion/consumption-map.json
  generator: scripts/generate-ptc-companion.mjs
  verifier: scripts/verify-ptc-public-template.mjs
  credentials: not-collected
  clean_profile_verified: false
  output: local-never-sync-directory

# 组合锁（release train 的唯一事实源）
# ---------------------------------------------------------------------------
# 每个组件独立发布、各自钉不可变 annotated tag；总仓库只声明"本次组合由哪些版本构成"。
# tag 名是可以被移动的，所以这里记录**解引用后的 commit SHA**：
# scripts/verify-components.mjs 会匿名重新解析每个 tag，凡解析结果与 commit 不一致即失败退出。
# 本表与 package.json 的依赖 spec 必须一致，不一致时验证器同样拒绝。
components:
  - id: provider-failover
    package: dsh-deepseek-keypool
    repo: https://github.com/Robert-Wang-08/dsh-provider-failover.git
    tag: v3.4.0
    commit: d0c6c2d6c1b0af78a0fbb60e89d86c4571b41f0e
    installable: true
  - id: archived-sessions
    package: dsh-archived-sessions
    repo: https://github.com/Robert-Wang-08/dsh-archived-sessions.git
    tag: v0.4.1
    commit: ca08ed9c109b7fd41f1b98e2314efe9ad80a998e
    installable: true
  - id: provider-badge
    package: dsh-plugin-provider-badge
    repo: https://github.com/Robert-Wang-08/dsh-plugin-provider-badge.git
    tag: v0.1.0
    commit: 84873291a3c8bdb085aee9bef4efe3b7d5b167e0
    installable: true
  - id: sidebar-visibility
    package: dsh-plugin-sidebar-visibility
    repo: https://github.com/Robert-Wang-08/dsh-plugin-sidebar-visibility.git
    tag: v0.0.3
    commit: 737501af4c48dd17bd74ef9d6d77022d75d5aaf3
    installable: true
  - id: subagent-monitor
    package: dsh-plugin-subagent-monitor
    repo: https://github.com/Robert-Wang-08/dsh-plugin-subagent-monitor.git
    tag: v0.1.0
    commit: 8ae0a9918de70363490ab691f475a1baae04e42c
    installable: true
  - id: acp-resilient
    package: '@local/dsh-subagent-acp-resilient'
    repo: https://github.com/Robert-Wang-08/dsh-subagent-acp-resilient.git
    tag: v0.2.1
    commit: 2959e9330caa2e9061cf419278df2445ebb837dd
    installable: true
  - id: recent-sessions
    package: dsh-recent-sessions
    repo: https://github.com/huangxp12/dsh-recent-sessions.git
    tag: v0.1.2
    commit: bc60683f915ed9d7015223eb22ce00a8593b2b45
    installable: true
  - id: permission-compat
    package: dsh-permission-compat
    repo: https://github.com/Robert-Wang-08/dsh-permission-compat.git
    tag: v0.1.0
    commit: ea50f0d608a8e5266eb7cde76ebb0cd531ad1506
    installable: false
    why: "宿主补丁工具：直接改写已安装的 dsh 模块，不能作为 dsh plugin 依赖安装，因此不在单命令路径内"

# 发布与一致性强制点：本块是这套机制的自我描述，供人与工具定位入口。
verification:
  lock: components
  verifier: scripts/verify-components.mjs
  ci: .github/workflows/verify-components.yml
  install: scripts/install.ps1
  prepare_profile: scripts/prepare-profile.mjs
  docs: docs/one-command-install.md
  inventory: docs/component-inventory.md
  release_order: "tag 组件 -> 更新 components 锁与依赖 pin -> verify-components -> tag 本包"

# 本包不覆盖、由别的组件负责的行（仅登记；verify 会拒绝本包再声明这些 id）。
delegated:
  - { id: preset-ptc-multi-agent, provided_by: "ptc-multi-agent-control 的 dsh-bundle" }
  - { id: subagent-acp-opencode-dsv41, provided_by: "ptc-multi-agent-control 的 dsh-bundle" }
  - { id: subagent-acp-kimi-docs, provided_by: "ptc-multi-agent-control 的 dsh-bundle" }
  - { id: subagent-acp-cursor-grok, provided_by: "ptc-multi-agent-control 的 dsh-bundle" }
  - { id: subagent-claude-opus5-plan, provided_by: "ptc-multi-agent-control 的 dsh-bundle" }
  - { id: subagent-claude-opus48-plan, provided_by: "ptc-multi-agent-control 的 dsh-bundle" }
  - { id: tool-subagent-opencode-dsv41, provided_by: "ptc-multi-agent-control 的 dsh-bundle" }
  - { id: tool-subagent-kimi-docs, provided_by: "ptc-multi-agent-control 的 dsh-bundle" }
  - { id: tool-subagent-cursor-grok, provided_by: "ptc-multi-agent-control 的 dsh-bundle" }
  - { id: tool-subagent-claude-opus5-plan, provided_by: "ptc-multi-agent-control 的 dsh-bundle" }
  - { id: tool-subagent-claude-opus48-plan, provided_by: "ptc-multi-agent-control 的 dsh-bundle" }
  - { id: tool-presentation, provided_by: "ptc-multi-agent-control 的 dsh-bundle" }
